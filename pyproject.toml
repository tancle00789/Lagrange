[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-knowledge-agent"
version = "0.1.0"
description = "Phase 1 echo runtime for a production knowledge research agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sse-starlette>=2.1.3,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "langgraph>=0.3,<2",
  "langgraph-checkpoint-postgres>=2,<6",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "PyJWT>=2.8,<3",
  "tenacity>=8.2,<10",
  "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "types-redis>=4,<5",
  "types-PyJWT>=1.7,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pk_agent"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pk_agent"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]
