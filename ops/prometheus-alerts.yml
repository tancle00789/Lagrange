groups:
  - name: production-knowledge-agent
    rules:
      - alert: PkAgentTargetDown
        expr: up{job="production-knowledge-agent"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Production Knowledge Agent is not scrapeable

      - alert: PkAgentHighServerErrorRate
        expr: |
          sum(rate(pk_agent_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(pk_agent_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx rate exceeds 5 percent

      - alert: PkAgentHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(pk_agent_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP p95 latency exceeds 2 seconds

      - alert: PkAgentJobFailures
        expr: increase(pk_agent_jobs_total{status="failed"}[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than three jobs failed in ten minutes

      - alert: PkAgentJobsStuck
        expr: pk_agent_active_jobs > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: A replica has held an active job for over thirty minutes

